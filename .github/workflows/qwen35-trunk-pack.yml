name: Qwen3.5 trunk-only packer tests

on:
  push:
    branches:
      - feat/qwen35-trunk-only-pager-msi
    paths:
      - 'tools/qwen35_trunk_pack.py'
      - 'tools/moe_pack.py'
      - 'tests/test_qwen35_trunk_pack.py'
      - '.github/workflows/qwen35-trunk-pack.yml'
  pull_request:
    paths:
      - 'tools/qwen35_trunk_pack.py'
      - 'tools/moe_pack.py'
      - 'tests/test_qwen35_trunk_pack.py'
      - '.github/workflows/qwen35-trunk-pack.yml'

permissions:
  contents: read

concurrency:
  group: qwen35-trunk-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'PyYAML>=6,<7'
      - name: Run GGUF packer regression tests (Qwen3.5 + existing)
        run: python -m unittest discover -s tests -p 'test_*pack.py' -v
